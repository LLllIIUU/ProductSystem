version: '3.8'

services:
  # 第一台 Java 服务器
  backend1:
    build: .
    ports:
      - "8081:8080" # 把容器的 8080 映射到电脑的 8081

  # 第二台 Java 服务器（负载均衡）
  backend2:
    build: .
    ports:
      - "8082:8080" # 把容器的 8080 映射到电脑的 8082

  # Nginx 前台（动静分离）
  nginx:
    image: nginx:latest
    ports:
      - "80:80" # Nginx 监听默认的网页端口
    volumes:
      # 把我们刚才写的配置文件，挂载进 Nginx 肚子里
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # 把前端 html 页面挂载进 Nginx 肚子里
      - ./src/main/resources/static:/usr/share/nginx/html
    depends_on:
      - backend1
      - backend2
